name: CI

permissions:
  contents: read

on:
  pull_request:
    branches:
      - master
      - v4.x
  push:
    branches:
      - master

env:
  RUSTFLAGS: -Dwarnings
  RUST_BACKTRACE: 1
  CARGO_INCREMENTAL: 0
  CARGO_PROFILE_DEV_DEBUG: 0

jobs:
  rustfmt:
    name: rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rustfmt
        run: rustup default stable && rustup component add rustfmt
      - name: Check formatting
        run: cargo fmt --all -- --check

  clippy:
    name: clippy
    runs-on: ubuntu-latest
    env:
      CARGO_HOME: ${{ github.workspace }}/.cache/cargo
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: 'recursive'
      - name: Install Rust
        run: rustup toolchain add stable --no-self-update --component clippy && rustup default stable
      - name: Get rust version
        id: rust-version
        shell: bash
        run: |
          echo "version=$(rustc --version)" >> $GITHUB_OUTPUT
      - name: Cache cargo index
        uses: actions/cache@v4
        with:
          path: |
            .cache/cargo/registry/index
            .cache/cargo/registry/cache
          key: index-${{ steps.rust-version.outputs.version }}-${{ hashFiles('Cargo.toml') }}
          enableCrossOsArchive: true
      - name: Fetch dependencies
        run: cargo fetch
      - name: Cache cargo index (save)
        uses: actions/cache/save@v4
        with:
          path: |
            .cache/cargo/registry/index
            .cache/cargo/registry/cache
          key: index-${{ steps.rust-version.outputs.version }}-${{ hashFiles('Cargo.toml') }}
          enableCrossOsArchive: true
      - name: Run clippy
        run: cargo clippy --all --all-targets --features rpk,prf,mlkem
      - name: Check docs
        run: cargo doc --no-deps -p korecrypto -p korecrypto-sys -p hyper-korecrypto -p tokio-korecrypto --features rpk,underscore-wildcards
        env:
          CARGO_BUILD_RUSTDOCFLAGS: "--cfg=docsrs"
          RUSTC_BOOTSTRAP: 1
          DOCS_RS: 1
      - name: Cargo.toml boring versions consistency
        shell: bash
        run: |
          WORKSPACE_VERSION=$(grep -F '[workspace.package]' -A1 Cargo.toml | grep -F version | grep -Eo '".*"')
          if [[ -z "$WORKSPACE_VERSION" ]]; then echo 2>&1 "error: can't find boring version"; exit 1; fi
          if grep -E 'boring.* =' Cargo.toml | grep -vF "$WORKSPACE_VERSION"; then
            echo 2>&1 "error: boring dependencies must match workspace version $WORKSPACE_VERSION"
            exit 1
          fi
  test:
    name: Test
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        thing:
        - stable
        - i686-mingw
        - arm-android
        - arm64-android
        - i686-android
        - x86_64-android
        - aarch64-ios
        - aarch64-ios-sim
        - x86_64-ios
        - i686-linux
        - arm-linux
        - aarch64-linux
        - arm64-macos
        - x86_64-macos
        - x86_64-mingw
        - i686-msvc
        - x86_64-msvc
        - x86_64-uefi
        - x86_64-uefi-fips
        include:
        - check_only: false
        - extra_test_args: ''
        - apt_packages: ''
        - custom_env: {}
        # cargo feature (예: fips, uefi, "uefi,fips").
        - features: ''
        # UEFI(x86_64-unknown-uefi) 빌드 여부. true 면 clang-22 툴체인 설치 +
        # 워크스페이스 테스트 대신 `-p korecrypto-sys -p korecrypto` 만 빌드(no_std/crypto 전용).
        - uefi: false
        - thing: stable
          target: x86_64-unknown-linux-gnu
          rust: stable
          os: ubuntu-latest
        - thing: arm-android
          target: armv7-linux-androideabi
          rust: stable
          os: ubuntu-latest
          check_only: true
        - thing: arm64-android
          target: aarch64-linux-android
          rust: stable
          os: ubuntu-latest
          check_only: true
        - thing: i686-android
          target: i686-linux-android
          rust: stable
          os: ubuntu-latest
          check_only: true
          custom_env:
            CXXFLAGS: -msse2
        - thing: x86_64-android
          target: x86_64-linux-android
          rust: stable
          os: ubuntu-latest
          check_only: true
        - thing: aarch64-ios
          target: aarch64-apple-ios
          os: macos-latest
          check_only: true
          custom_env:
            IPHONEOS_DEPLOYMENT_TARGET: 17.5
          # It's... theoretically possible to run tests on iPhone Simulator,
          # but for now, make sure that BoringSSL only builds.
        - thing: aarch64-ios-sim
          target: aarch64-apple-ios-sim
          os: macos-latest
          check_only: true
          custom_env:
            IPHONEOS_DEPLOYMENT_TARGET: 17.5
        - thing: x86_64-ios
          target: x86_64-apple-ios
          os: macos-latest
          check_only: true
          custom_env:
            IPHONEOS_DEPLOYMENT_TARGET: 17.5
        - thing: i686-linux
          target: i686-unknown-linux-gnu
          rust: stable
          os: ubuntu-latest
          apt_packages: gcc-multilib g++-multilib
          custom_env:
            CXXFLAGS: -msse2
        - thing: arm-linux
          target: arm-unknown-linux-gnueabi
          rust: stable
          os: ubuntu-latest
          apt_packages: gcc-arm-linux-gnueabi g++-arm-linux-gnueabi
          check_only: true
          custom_env:
            CC_arm-unknown-linux-gnueabi: arm-linux-gnueabi-gcc
            CXX_arm-unknown-linux-gnueabi: arm-linux-gnueabi-g++
            CARGO_TARGET_ARM_UNKNOWN_LINUX_GNUEABI_LINKER: arm-linux-gnueabi-g++
        - thing: aarch64-linux
          target: aarch64-unknown-linux-gnu
          rust: stable
          os: ubuntu-latest
          apt_packages: crossbuild-essential-arm64
          check_only: true
          custom_env:
            CC_aarch64_unknown_linux_gnu: aarch64-linux-gnu-gcc
            CXX_aarch64_unknown_linux_gnu: aarch64-linux-gnu-g++
            CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-g++
        - thing: arm64-macos
          target: aarch64-apple-darwin
          rust: stable
          os: macos-latest
          check_only: true
        - thing: x86_64-macos
          target: x86_64-apple-darwin
          rust: stable
          os: macos-latest
        - thing: x86_64-mingw
          target: x86_64-pc-windows-gnu
          rust: stable
          os: windows-latest
          check_only: true # tests are flaky for unclear reasons
          custom_env:
            CC: gcc
            CXX: g++
            C_INCLUDE_PATH: "C:\\msys64\\usr\\include"
            CPLUS_INCLUDE_PATH: "C:\\msys64\\usr\\include"
            LIBRARY_PATH: "C:\\msys64\\usr\\lib"
            RUSTC_BOOTSTRAP: 1 # for -Z checksum-freshness
          # CI's Windows doesn't have required root certs
          extra_test_args: --workspace --exclude tokio-korecrypto --exclude hyper-korecrypto -Z checksum-freshness
        - thing: i686-mingw
          target: i686-pc-windows-gnu
          rust: stable
          os: windows-latest
          check_only: true
          custom_env:
            RUSTC_BOOTSTRAP: 1 # for -Z checksum-freshness
            CMAKE_GENERATOR: "MinGW Makefiles"
            COLLECT_GCC: null
          # CI's Windows doesn't have required root certs
          extra_test_args: --workspace --exclude tokio-korecrypto --exclude hyper-korecrypto -Z checksum-freshness
        - thing: i686-msvc
          target: i686-pc-windows-msvc
          rust: stable-x86_64-msvc
          os: windows-latest
          custom_env:
            RUSTC_BOOTSTRAP: 1 # for -Z checksum-freshness
            CXXFLAGS: -msse2
          # CI's Windows doesn't have required root certs
          extra_test_args: --workspace --exclude tokio-korecrypto --exclude hyper-korecrypto -Z checksum-freshness
        - thing: x86_64-msvc
          target: x86_64-pc-windows-msvc
          rust: stable-x86_64-msvc
          os: windows-latest
          custom_env:
            RUSTC_BOOTSTRAP: 1 # for -Z checksum-freshness
          # CI's Windows doesn't have required root certs
          extra_test_args: --workspace --exclude tokio-korecrypto --exclude hyper-korecrypto -Z checksum-freshness
        - thing: x86_64-msvc-static
          target: x86_64-pc-windows-msvc
          rust: stable-x86_64-msvc
          os: windows-latest
          custom_env:
            RUSTC_BOOTSTRAP: 1 # for -Z checksum-freshness
            RUSTFLAGS: -Dwarnings -C target-feature=+crt-static
          # CI's Windows doesn't have required root certs
          extra_test_args: --workspace --exclude tokio-korecrypto --exclude hyper-korecrypto -Z checksum-freshness

        # ===== UEFI target 빌드 =====
        - thing: x86_64-uefi
          target: x86_64-unknown-uefi
          rust: stable
          os: ubuntu-latest
          check_only: true
          uefi: true
          features: uefi
        - thing: x86_64-uefi-fips
          target: x86_64-unknown-uefi
          rust: stable
          os: ubuntu-latest
          check_only: true
          uefi: true
          features: uefi,kcmvp
    env:
      CARGO_HOME: ${{ github.workspace }}/.cache/cargo
      CARGO_BUILD_BUILD_DIR: ${{ github.workspace }}/.cache/build-dir
    steps:
    - uses: actions/checkout@v4
      with:
        submodules: 'recursive'
    - name: Install Rust (rustup)
      run: rustup update ${{ matrix.rust }} --no-self-update && rustup default ${{ matrix.rust }} && rustup target add ${{ matrix.target }}
      shell: bash
    - name: Get rust version
      id: rust-version
      shell: bash
      run: |
        echo "version=$(rustc --version)" >> $GITHUB_OUTPUT
    - name: Install golang
      uses: actions/setup-go@v5
      with:
        go-version: '>=1.22.0'
    - name: Install target-specific APT dependencies
      if: "matrix.apt_packages != ''"
      run: sudo apt update && sudo apt install -y ${{ matrix.apt_packages }}
      shell: bash
    - name: Install nasm
      if: startsWith(matrix.os, 'windows')
      run: choco install nasm
      shell: cmd
    - name: Setup 32-bit MSYS2
      if: matrix.thing == 'i686-mingw'
      uses: msys2/setup-msys2@v2
      id: msys2
      with:
        msystem: MINGW32
        path-type: inherit
        install: >-
          mingw-w64-i686-gcc
          mingw-w64-i686-cmake
    - name: Setup 32-bit MSYS2 Env vars
      if: matrix.thing == 'i686-mingw'
      shell: bash
      run: |
        MSYS_ROOT='${{ steps.msys2.outputs.msys2-location }}'
        test -d "$MSYS_ROOT\\mingw32\\bin"
        echo >> $GITHUB_PATH "$MSYS_ROOT\\mingw32\\bin"
        echo >> $GITHUB_PATH "$MSYS_ROOT\\usr\\bin"
        echo >> $GITHUB_ENV CC="$MSYS_ROOT\\mingw32\\bin\\gcc"
        echo >> $GITHUB_ENV CXX="$MSYS_ROOT\\mingw32\\bin\\g++"
        echo >> $GITHUB_ENV AR="$MSYS_ROOT\\mingw32\\bin\\ar"
        echo >> $GITHUB_ENV CFLAGS="-mlong-double-64 -I$MSYS_ROOT\\mingw32\\include"
        echo >> $GITHUB_ENV CXXFLAGS="-mlong-double-64 -I$MSYS_ROOT\\mingw32\\include"
        echo >> $GITHUB_ENV BINDGEN_EXTRA_CLANG_ARGS="-mlong-double-64 -I$MSYS_ROOT\\mingw32\\include"
        echo >> $GITHUB_ENV LIBRARY_PATH="$MSYS_ROOT\\mingw32\\lib"
        echo >> $GITHUB_ENV LDFLAGS="-L$MSYS_ROOT\\mingw32\\lib"
    - name: Install LLVM and Clang
      if: startsWith(matrix.os, 'windows')
      uses: KyleMayes/install-llvm-action@v2
      with:
        version: "11.0"
        directory: ${{ runner.temp }}/llvm
    - name: Set LIBCLANG_PATH
      if: startsWith(matrix.os, 'windows')
      run: echo "LIBCLANG_PATH=$((gcm clang).source -replace "clang.exe")" >> $env:GITHUB_ENV
    - name: Set Android Linker path
      if: endsWith(matrix.thing, '-android')
      run: echo "CARGO_TARGET_$(echo ${{ matrix.target }} | tr \\-a-z _A-Z)_LINKER=$ANDROID_NDK/toolchains/llvm/prebuilt/linux-x86_64/bin/$(echo ${{ matrix.target }} | sed s/armv7/armv7a/)21-clang++" >> "$GITHUB_ENV"
    - name: Install LLVM 22 (UEFI)
      # UEFI/picolibc 빌드는 clang >= 19 필수(x86_64-unknown-uefi 데이터 레이아웃 버그).
      # 비-FIPS 경로는 clang 을 강제하지 않아 CC/CXX 를 명시해야 시스템 gcc 로 폴백하지
      # 않는다(FIPS 는 build.rs 가 clang 을 강제하지만 그 경우에도 clang-22 로 맞춘다).
      if: matrix.uefi
      run: |
        wget -qO- https://apt.llvm.org/llvm.sh | sudo bash -s -- 22
        echo "/usr/lib/llvm-22/bin" >> "$GITHUB_PATH"
        echo "LIBCLANG_PATH=/usr/lib/llvm-22/lib" >> "$GITHUB_ENV"
        echo "PICOLIBC_CC=clang-22" >> "$GITHUB_ENV"
        echo "CC_x86_64_unknown_uefi=clang-22" >> "$GITHUB_ENV"
        echo "CXX_x86_64_unknown_uefi=clang++-22" >> "$GITHUB_ENV"
    - name: Prepopulate cargo index
      uses: actions/cache/restore@v4
      with:
        path: |
          .cache/cargo/registry/index
          .cache/cargo/registry/cache
        key: index-${{ steps.rust-version.outputs.version }}-${{ hashFiles('Cargo.toml') }}
        enableCrossOsArchive: true
    - name: Fetch deps
      run: cargo fetch --target ${{ matrix.target }}
      shell: bash
      env: ${{ matrix.custom_env }}
      # Windows builds are the slowest
    - name: Cache deps in Windows tests
      if: startsWith(matrix.os, 'windows')
      uses: actions/cache/restore@v4
      id: test-cache-restore
      with:
        path: .cache/build-dir
        key: wintest-${{ matrix.target }}-${{ hashFiles('Cargo.lock') }}
    - name: Build tests
      # We `build` because we want the linker to verify we are cross-compiling correctly for check-only targets.
      if: "!matrix.uefi"
      run: cargo build -vv --target ${{ matrix.target }} --tests ${{ matrix.extra_test_args }} ${{ matrix.features != '' && format('--features {0}', matrix.features) || '' }}
      shell: bash
      env: ${{ matrix.custom_env }}
    - name: Build korecrypto-sys (UEFI)
      # UEFI 타깃은 no_std/crypto 전용이라 워크스페이스(--tests) 대신 크레이트만 빌드.
      if: matrix.uefi
      run: cargo build -vv -p korecrypto-sys -p korecrypto --target ${{ matrix.target }} --features ${{ matrix.features }}
      shell: bash
      env: ${{ matrix.custom_env }}
      # By default it'd be saved after later cargo calls, which already invalidated the cache
    - name: Cache deps in Windows tests
      if: startsWith(matrix.os, 'windows')
      uses: actions/cache/save@v4
      with:
        path: .cache/build-dir
        key: ${{ steps.test-cache-restore.outputs.cache-primary-key }}
    - name: Run tests (skip=${{ matrix.check_only }})
      if: "!matrix.check_only"
      run: cargo test --target ${{ matrix.target }} ${{ matrix.extra_test_args }} ${{ matrix.features != '' && format('--features {0}', matrix.features) || '' }}
      shell: bash
      env: ${{ matrix.custom_env }}
    - name: Test korecrypto-sys cargo publish
      # feature 빌드(fips/uefi)는 별도 publish 검증(test-fips 등)이 있고 slowest 라 생략.
      if: "matrix.features == '' && matrix.thing != 'i686-mingw' && matrix.thing != 'i686-msvc' && matrix.thing != 'x86_64-mingw'" # slowest builds
      # Running `cargo publish --dry-run` tests two things:
      #
      # 1. That `korecrypto-sys` can build BoringSSL with just the files included
      #    in the crates.io package (as determined by the `include` field in
      #    the `Cargo.toml`).
      # 2. That the final `korecrypto-sys` package size, including the BoringSSL
      #    submodules, is not too large to be published to `crates.io`.
      #
      # Both of these may no longer be the case after updating the BoringSSL
      # submodules to a new revision, so it's important to test this on CI.
      run: cargo publish --dry-run --target ${{ matrix.target }} -p korecrypto-sys
      shell: bash
      env: ${{ matrix.custom_env }}

  test-fips:
    name: Test FIPS integration
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
      with:
        submodules: 'recursive'
    - name: Install Rust (rustup)
      run: rustup update stable --no-self-update && rustup default stable
      shell: bash
    - name: Install golang
      uses: actions/setup-go@v5
      with:
        go-version: '>=1.22.0'
    - name: Run tests
      run: cargo test --features kcmvp
    - name: Test korecrypto-sys cargo publish (FIPS)
      # Running `cargo publish --dry-run` tests two things:
      #
      # 1. That `korecrypto-sys` can build BoringSSL with just the files included
      #    in the crates.io package (as determined by the `include` field in
      #    the `Cargo.toml`).
      # 2. That the final `korecrypto-sys` package size, including the BoringSSL
      #    submodules, is not too large to be published to `crates.io`.
      #
      # Both of these may no longer be the case after updating the BoringSSL
      # submodules to a new revision, so it's important to test this on CI.
      run: cargo publish --dry-run -p korecrypto-sys --features kcmvp

  # FIPS 가동 전 자가시험(무결성 검사 + KAT)과 승인 알고리즘을 실제로 "실행"해 검증하는
  # 전용 job. 테스트 바이너리(`boring-sys/tests/fips_selftest.rs`, test_fips.cc 의 Rust
  # 포팅)를 실행하면 FIPS 모듈 로드 시 무결성/KAT 자가시험이 돌고(실패 시 startup abort),
  # 이어서 각 승인 알고리즘 연산을 수행한다. 크로스 아키텍처(aarch64)는 qemu-user-static
  # 로 타깃 바이너리를 에뮬레이션 실행하고, Windows(mingw/msvc)는 windows-latest 네이티브.
  # NOTE: BoringSSL delocate(FIPS 무결성 경계)는 x86_64 와 aarch64 만 지원한다.
  test-fips-selftest:
    name: FIPS self-test (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: x86_64-linux
            os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            rust: stable
          - name: aarch64-linux
            os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            rust: stable
            cross: aarch64-linux-gnu
            qemu_arch: aarch64
            apt: crossbuild-essential-arm64 qemu-user-static
          - name: x86_64-mingw
            os: windows-latest
            target: x86_64-pc-windows-gnu
            rust: stable
          - name: x86_64-msvc
            os: windows-latest
            target: x86_64-pc-windows-msvc
            rust: stable-x86_64-msvc
          - name: x86_64-msvc-static
            os: windows-latest
            target: x86_64-pc-windows-msvc
            rust: stable-x86_64-msvc
            rustflags: "-C target-feature=+crt-static"
          # 릴리스 최적화된 bcm 어셈블리는 디버그에 없는 코드젠(rex64 tailcall,
          # cmpq/.refptr 경계검사)을 만들어 delocate COFF 경로를 다르게 태운다.
          # MSVC 릴리스 회귀를 잡기 위해 --release 로도 자가시험을 돌린다.
          - name: x86_64-msvc-release
            os: windows-latest
            target: x86_64-pc-windows-msvc
            rust: stable-x86_64-msvc
            release: true
    env:
      RUSTC_BOOTSTRAP: 1
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: 'recursive'
      - name: Install Rust (rustup)
        run: rustup update ${{ matrix.rust }} --no-self-update && rustup default ${{ matrix.rust }} && rustup target add ${{ matrix.target }}
        shell: bash
      - name: Install golang
        uses: actions/setup-go@v5
        with:
          go-version: '>=1.22.0'
      - name: Install LLVM and Clang (Windows)
        # FIPS(COFF delocate)는 clang 을 강제하므로 Windows 에서도 clang 이 필요하다.
        # 버전 요구:
        #   - llvm-11: `Span` member reference 오류(crypto/fipsmodule/cipher/internal.h).
        #   - llvm-12: 최신 Windows SDK 의 msvcrtd.lib 가 참조하는 EH continuation guard
        #     심볼(__guard_eh_cont_table/_count)을 lld-link 가 합성하지 못해 링크 실패
        #     (해당 합성은 lld-link 13+).
        #   - llvm-21: 이전 버전은 regex check 에서 실패한다.
        if: startsWith(matrix.os, 'windows')
        uses: KyleMayes/install-llvm-action@v2
        with:
          version: "21.1"
          directory: ${{ runner.temp }}/llvm
      - name: Set LIBCLANG_PATH (Windows)
        if: startsWith(matrix.os, 'windows')
        run: echo "LIBCLANG_PATH=$((gcm clang).source -replace "clang.exe")" >> $env:GITHUB_ENV
      - name: Install cross toolchain + qemu-user (Linux cross)
        if: matrix.qemu_arch != ''
        run: sudo apt-get update && sudo apt-get install -y ${{ matrix.apt }}
      - name: Configure cross build + qemu runner (Linux cross)
        if: matrix.qemu_arch != ''
        shell: bash
        # FIPS 는 clang 을 강제한다. 크로스 링크·무결성 해시 일관성은 boring-sys/cmake/
        # <arch>-linux.cmake 가 clang 에 GNU 크로스 ld 를 지정해 처리한다.
        # KORECRYPTO_FIPS_SYSROOT 는 설정하지 않는다(--sysroot 가 GNU 링커스크립트의
        # 절대경로 해석을 sysroot 기준으로 이중화해 링크를 깨뜨림).
        run: |
          T=$(echo '${{ matrix.target }}' | tr '[:lower:]-' '[:upper:]_')
          echo "CARGO_TARGET_${T}_LINKER=${{ matrix.cross }}-gcc" >> "$GITHUB_ENV"
          echo "CARGO_TARGET_${T}_RUNNER=qemu-${{ matrix.qemu_arch }}-static -L /usr/${{ matrix.cross }}" >> "$GITHUB_ENV"
      - name: Run FIPS self-test (test_fips port)
        shell: bash
        # boring-sys/tests/fips_selftest.rs = test_fips.cc 의 Rust 포팅. 로드 시
        # 무결성/KAT 자가시험 + 승인 알고리즘 실행을 검증한다.
        run: cargo test -p korecrypto-sys --features kcmvp --target ${{ matrix.target }} ${{ matrix.release && '--release' || '' }} --test fips_selftest -- --nocapture
        env:
          RUSTFLAGS: -Dwarnings ${{ matrix.rustflags }}

  test-boringssl:
    name: Test BoringSSL upstream test suite
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
      with:
        submodules: 'recursive'
    - name: Install golang
      uses: actions/setup-go@v5
      with:
        go-version: '>=1.22.0'
    - name: Install build tools (ninja, cmake)
      run: sudo apt-get update && sudo apt-get install -y ninja-build cmake
    - name: Apply boring-sys patches
      working-directory: boring-sys/deps/boringssl
      run: |
        for p in boring-pq.patch rpk.patch underscore-wildcards.patch; do
          echo "Applying $p"
          patch -p1 < "../../patches/$p"
        done
    - name: Configure BoringSSL build
      working-directory: boring-sys/deps/boringssl
      run: cmake -GNinja -B build -DCMAKE_BUILD_TYPE=Release
    - name: Build BoringSSL
      working-directory: boring-sys/deps/boringssl
      run: ninja -C build
    - name: Run BoringSSL C/C++ test suite
      working-directory: boring-sys/deps/boringssl
      run: go run util/all_tests.go
    - name: Run BoringSSL SSL runner tests
      working-directory: boring-sys/deps/boringssl/ssl/test/runner
      run: go test

  cross-build:
    name: Cross build from macOS to Linux
    runs-on: macos-latest
    strategy:
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
    steps:
    - uses: actions/checkout@v4
      with:
        submodules: 'recursive'
    - name: Install Rust (rustup)
      run: rustup toolchain install stable --no-self-update --profile minimal --target ${{ matrix.target }} && rustup default stable
      shell: bash
    - name: Install golang
      uses: actions/setup-go@v5
      with:
        go-version: '>=1.22.0'
    - name: Install ${{ matrix.target }} toolchain
      run: |
        brew tap messense/macos-cross-toolchains
        brew trust messense/macos-cross-toolchains
        brew install ${{ matrix.target }}
    - name: Set BORING_BSSL_SYSROOT
      run: echo "BORING_BSSL_SYSROOT=$(brew --prefix ${{ matrix.target }})/toolchain/${{ matrix.target }}/sysroot" >> $GITHUB_ENV
      shell: bash
    - name: Set CARGO_TARGET_X86_64_UNKNOWN_LINUX_GNU_LINKER
      run: echo "CARGO_TARGET_X86_64_UNKNOWN_LINUX_GNU_LINKER=${{ matrix.target }}-gcc" >> $GITHUB_ENV
      shell: bash
    - name: Set CXXFLAGS
      run: echo "CXXFLAGS=-D__STDC_FORMAT_MACROS" >> $GITHUB_ENV
    - name: Build for ${{ matrix.target }}
      run: cargo build --target ${{ matrix.target }} --all-targets

  uefi-kcmvp-smoketest:
    name: UEFI KCMVP smoketest (${{ matrix.arch }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            target: x86_64-unknown-uefi
            qemu_pkg: qemu-system-x86
            fw_pkg: ovmf
          - arch: aarch64
            target: aarch64-unknown-uefi
            qemu_pkg: qemu-system-arm
            fw_pkg: qemu-efi-aarch64
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: 'recursive'
      - name: Install Rust (stable) + UEFI target
        run: rustup update stable --no-self-update && rustup default stable && rustup target add ${{ matrix.target }}
      - name: Install golang
        uses: actions/setup-go@v5
        with:
          go-version: '>=1.22.0'
      - name: Install LLVM 22
        run: wget -qO- https://apt.llvm.org/llvm.sh | sudo bash -s -- 22
      - name: Install QEMU and UEFI firmware
        run: sudo apt-get install -y ${{ matrix.qemu_pkg }} ${{ matrix.fw_pkg }}
      - name: Enable KVM (x86_64)
        run: |
          [ ! -e /dev/kvm ] || sudo chmod 0666 /dev/kvm
      - name: Run UEFI smoketest
        env:
          TARGET_TRIPLE: ${{ matrix.target }}
        run: ./uefi-smoketest/run-qemu.sh

  test-features:
    name: Test features
    runs-on: ubuntu-latest
    env:
      CARGO_INCREMENTAL: 1
    steps:
    - uses: actions/checkout@v4
      with:
        submodules: 'recursive'
    - name: Install Rust (rustup)
      run: rustup update stable --no-self-update && rustup default stable
      shell: bash
    - run: cargo check --no-default-features --features std-libc
      name: Check `--no-default-features`
    - run: cargo check --features prf,mlkem,credential
      name: Check `mlkem,credential`
    - run: cargo test --features rpk,prf
      name: Run `rpk` tests
    - run: cargo test --features underscore-wildcards
      name: Run `underscore-wildcards` tests
    - run: cargo test --features rpk,underscore-wildcards
      name: Run `rpk,underscore-wildcards` tests
    - run: cargo test --features rpk,underscore-wildcards,mlkem
      name: Run `rpk,underscore-wildcards` tests

  # KCMVP 엔트로피 평가(SP 800-90B)용 잡음원 샘플 파일을 OS 별로 생성해 artifact 로
  # 올린다. 수집은 반드시 실제 KCMVP 모듈 경로(KCMVP_entropy_raw_noise_samples →
  # bssl::entropy::GetSamples)로 이뤄진다. Linux/Windows 는 네이티브 바이너리로,
  # UEFI 는 QEMU 게스트 안에서 수집해 시리얼로 덤프한 뒤 호스트에서 포맷한다.
  entropy-assess:
    name: Entropy assessment (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x86_64
            os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            rust: stable
          - name: windows-x86_64
            os: windows-latest
            target: x86_64-pc-windows-msvc
            rust: stable-x86_64-msvc
    env:
      RUSTC_BOOTSTRAP: 1
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: 'recursive'
      - name: Install Rust (rustup)
        run: rustup update ${{ matrix.rust }} --no-self-update && rustup default ${{ matrix.rust }} && rustup target add ${{ matrix.target }}
        shell: bash
      - name: Install golang
        uses: actions/setup-go@v5
        with:
          go-version: '>=1.22.0'
      - name: Install LLVM and Clang (Windows)
        # FIPS(COFF delocate)는 Windows 에서도 clang 을 강제한다(test-fips-selftest 참고).
        if: startsWith(matrix.os, 'windows')
        uses: KyleMayes/install-llvm-action@v2
        with:
          version: "21.1"
          directory: ${{ runner.temp }}/llvm
      - name: Set LIBCLANG_PATH (Windows)
        if: startsWith(matrix.os, 'windows')
        run: echo "LIBCLANG_PATH=$((gcm clang).source -replace "clang.exe")" >> $env:GITHUB_ENV
      - name: Generate entropy assessment file
        shell: bash
        # 실제 KCMVP 모듈 경로로 25만 개 잡음원 샘플을 수집해 평가 파일을 만든다.
        run: cargo run -p entropy-assess --features kcmvp --target ${{ matrix.target }} -- collect --label ${{ matrix.name }} entropy-${{ matrix.name }}.txt
      - name: Upload entropy assessment artifact
        uses: actions/upload-artifact@v4
        with:
          name: entropy-${{ matrix.name }}
          path: entropy-${{ matrix.name }}.txt
          if-no-files-found: error

  entropy-assess-uefi:
    name: Entropy assessment (uefi-${{ matrix.arch }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            target: x86_64-unknown-uefi
            qemu_pkg: qemu-system-x86
            fw_pkg: ovmf
          - arch: aarch64
            target: aarch64-unknown-uefi
            qemu_pkg: qemu-system-arm
            fw_pkg: qemu-efi-aarch64
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: 'recursive'
      - name: Install Rust (stable) + UEFI target
        run: rustup update stable --no-self-update && rustup default stable && rustup target add ${{ matrix.target }}
      - name: Install golang
        uses: actions/setup-go@v5
        with:
          go-version: '>=1.22.0'
      - name: Install LLVM 22
        run: wget -qO- https://apt.llvm.org/llvm.sh | sudo bash -s -- 22
      - name: Install QEMU, UEFI firmware, xxd
        run: sudo apt-get install -y ${{ matrix.qemu_pkg }} ${{ matrix.fw_pkg }} xxd
      - name: Enable KVM (x86_64)
        run: |
          [ ! -e /dev/kvm ] || sudo chmod 0666 /dev/kvm
      - name: Generate entropy assessment file (UEFI/QEMU)
        env:
          TARGET_TRIPLE: ${{ matrix.target }}
        run: ./uefi-smoketest/run-entropy.sh entropy-uefi-${{ matrix.arch }}.txt
      - name: Upload entropy assessment artifact
        uses: actions/upload-artifact@v4
        with:
          name: entropy-uefi-${{ matrix.arch }}
          path: entropy-uefi-${{ matrix.arch }}.txt
          if-no-files-found: error
